coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 5%
ignore:
  - "test/*"
  - "tools/*"
  # Shells out to pip; running it would mutate the CI Python environment,
  # so it is intentionally not covered by automated tests.
  - "toolbox/private/installZarrPythonPackages.m"