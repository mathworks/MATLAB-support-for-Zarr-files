name: MATLAB Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest

      - name: Verify release tag and build toolbox
        uses: matlab-actions/run-build@v3
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        with:
          tasks: checkVersion mltbx

      - name: Attach toolbox to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          release/MATLAB_Support_for_Zarr_Files.mltbx --clobber
